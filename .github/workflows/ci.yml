name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Bootstrap job (feature branches only): keeps pnpm-lock.yaml and Prisma
  # migrations in sync with package.json / schema.prisma, committing the result
  # back to the branch. Remove once dependency/migration authoring is done on a
  # machine with registry access.
  sync:
    name: Sync lockfile and migrations
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow_diff?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Update lockfile
        run: scripts/ci-step.sh "pnpm install (lockfile)" pnpm install --lockfile-only --no-frozen-lockfile
      - name: Install dependencies
        run: scripts/ci-step.sh "pnpm install" pnpm install --frozen-lockfile
      - name: Generate pending Prisma migration
        working-directory: apps/api
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE shadow_diff;' || true
          if ! pnpm exec prisma migrate diff \
              --from-migrations prisma/migrations \
              --to-schema-datamodel prisma/schema.prisma \
              --shadow-database-url "$SHADOW_DATABASE_URL" \
              --script > /tmp/pending.raw 2> /tmp/pending.err; then
            cat /tmp/pending.err
            echo "::error title=prisma migrate diff::$(tr '\n' ' ' < /tmp/pending.err | head -c 3000)"
            exit 1
          fi
          # Keep only SQL (drop CLI warnings); every Prisma diff line group starts with "-- ".
          sed -n '/^-- /,$p' /tmp/pending.raw > /tmp/pending.sql || true
          if [ ! -s /tmp/pending.sql ] || grep -q "empty migration" /tmp/pending.sql; then
            echo "Schema and migrations are in sync."
          else
            name="schema_update"
            if [ -f prisma/NEXT_MIGRATION ]; then
              name="$(head -n 1 prisma/NEXT_MIGRATION | tr -cd 'a-z0-9_')"
              rm -f prisma/NEXT_MIGRATION
            fi
            dir="prisma/migrations/$(date -u +%Y%m%d%H%M%S)_${name}"
            mkdir -p "$dir"
            cp /tmp/pending.sql "$dir/migration.sql"
            echo "Created $dir"
          fi
      - name: Commit and re-trigger
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pnpm-lock.yaml apps/api/prisma
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(ci): sync lockfile and prisma migrations [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          gh workflow run ci.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

  quality:
    name: Lint, typecheck, build, unit tests
    needs: [sync]
    if: >-
      always() &&
      (needs.sync.result == 'skipped' ||
       (needs.sync.result == 'success' && needs.sync.outputs.changed != 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: scripts/ci-step.sh "pnpm install" pnpm install --frozen-lockfile
      - name: Build contracts
        run: scripts/ci-step.sh "build contracts" pnpm --filter @storeos/contracts build
      - name: Prisma client
        run: scripts/ci-step.sh "prisma generate" pnpm db:generate
      - name: Lint
        run: scripts/ci-step.sh "lint" pnpm lint
      - name: Typecheck
        run: scripts/ci-step.sh "typecheck" pnpm typecheck
      - name: Unit tests
        run: scripts/ci-step.sh "unit tests" pnpm test
      - name: Build
        run: scripts/ci-step.sh "build" pnpm build

  integration:
    name: Integration tests (Postgres + Redis)
    needs: [sync]
    if: >-
      always() &&
      (needs.sync.result == 'skipped' ||
       (needs.sync.result == 'success' && needs.sync.outputs.changed != 'true'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storeos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storeos_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh-secret-012345
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: scripts/ci-step.sh "pnpm install" pnpm install --frozen-lockfile
      - name: Build contracts
        run: scripts/ci-step.sh "build contracts" pnpm --filter @storeos/contracts build
      - name: Prisma client
        run: scripts/ci-step.sh "prisma generate" pnpm db:generate
      - name: Apply migrations
        run: scripts/ci-step.sh "prisma migrate deploy" pnpm db:deploy
      - name: Check schema drift
        working-directory: apps/api
        run: ../../scripts/ci-step.sh "schema drift" pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Integration tests
        run: scripts/ci-step.sh "integration tests" pnpm test:integration

  docker:
    name: Docker images
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: scripts/ci-step.sh "docker api" docker build -f apps/api/Dockerfile -t storeos-api:ci .
      - name: Build web image
        run: scripts/ci-step.sh "docker web" docker build -f apps/web/Dockerfile -t storeos-web:ci .
