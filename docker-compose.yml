services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storeos}
      POSTGRES_USER: ${POSTGRES_USER:-storeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: storeos, RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me-in-production} }
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment: { MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-in-production} }
    ports: ["7700:7700"]
    volumes: [meili_data:/meili_data]
volumes: { postgres_data: {}, redis_data: {}, rabbitmq_data: {}, meili_data: {} }
