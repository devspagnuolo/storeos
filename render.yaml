# Render Blueprint - STOREOS production baseline
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: storeos-nexo-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @storeos/api prisma:generate && pnpm --filter @storeos/api exec prisma migrate deploy && pnpm --filter @storeos/api build
    startCommand: pnpm --filter @storeos/api start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - packages/contracts/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: storeos-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: storeos-cache
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # PIX automático: sem MERCADOPAGO_ACCESS_TOKEN o checkout usa o fluxo manual.
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      # URL pública desta API, usada como notification_url do webhook de pagamento.
      - key: API_PUBLIC_URL
        sync: false

  - type: web
    name: storeos-nexo-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @storeos/web build
    startCommand: pnpm --filter @storeos/web start
    healthCheckPath: /
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/web/**
        - packages/contracts/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: keyvalue
    name: storeos-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: storeos-postgres
    databaseName: storeos
    plan: free
    region: oregon
    postgresMajorVersion: 16
