# Render Blueprint - STOREOS production baseline
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: storeos-nexo-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @storeos/api prisma:generate && pnpm --filter @storeos/api exec prisma migrate deploy && pnpm --filter @storeos/api build
    startCommand: pnpm --filter @storeos/api start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - packages/contracts/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: storeos-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: storeos-cache
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      # Chave pública (APP_USR-...): habilita cartão de crédito com parcelas no checkout.
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      # Bling (ERP): aplicativo criado em Preferências > Integrações; o link de redirecionamento é API_PUBLIC_URL/api/v1/bling/callback.
      - key: BLING_CLIENT_ID
        sync: false
      - key: BLING_CLIENT_SECRET
        sync: false
      # Cartão pela Rede (e.Rede/Itaú): com REDE_PV e REDE_TOKEN a Rede passa a cobrar o cartão; PIX e boleto seguem no Mercado Pago.
      - key: REDE_PV
        sync: false
      - key: REDE_TOKEN
        sync: false
      - key: REDE_SANDBOX
        value: "false"
      - key: API_PUBLIC_URL
        sync: false
      # E-mails transacionais (Resend) e cotação de frete (SuperFrete ou Melhor Envio): vazios = modo simulado / só regras da loja.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPERFRETE_TOKEN
        sync: false
      - key: MELHOR_ENVIO_TOKEN
        sync: false
      - key: SHIPPING_ORIGIN_ZIP
        sync: false
      - key: SWAGGER_ENABLED
        value: "false"
      # Cloudflare R2: configure no serviço API e sincronize o Blueprint após criar o bucket.
      - key: STOREOS_R2_ACCOUNT_ID
        sync: false
      - key: STOREOS_R2_ACCESS_KEY_ID
        sync: false
      - key: STOREOS_R2_SECRET_ACCESS_KEY
        sync: false
      - key: STOREOS_R2_BUCKET
        sync: false
      - key: STOREOS_R2_PUBLIC_URL
        sync: false

  - type: web
    name: storeos-nexo-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @storeos/web build
    startCommand: pnpm --filter @storeos/web start
    healthCheckPath: /
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/web/**
        - packages/contracts/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

  - type: keyvalue
    name: storeos-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: storeos-postgres
    databaseName: storeos
    plan: basic_256mb
    region: oregon
    postgresMajorVersion: 16
